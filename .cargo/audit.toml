# cargo-audit configuration. Every ignore needs a justification and an exit plan.
[advisories]
ignore = [
  # RUSTSEC-2024-0344: timing variability in curve25519-dalek 3.2.0 Scalar sub.
  # Pulled in only via `ecvrf` 0.4.3 (VRF leader election in kovanica-crypto),
  # whose latest release still depends on curve25519-dalek 3.x, so there is no
  # semver-compatible upgrade. Replacing the VRF backend changes consensus-
  # critical cryptography and needs its own reviewed change (already tracked in
  # AUDIT_REPORT.md / AUTOMATED_SECURITY_CHECKS.md). Remove this ignore once
  # the VRF moves to a curve25519-dalek >= 4.1.3 implementation.
  "RUSTSEC-2024-0344",

  # RUSTSEC-2025-0141: bincode 1.3.3 is unmaintained.
  # Bincode 1.3.3 canonical serialization format is baked into block header
  # hashing, state root computation, transaction wire format, and consensus signing.
  # Migrating to bincode v2 or postcard changes serialized byte layout and
  # requires a coordinated hard fork. Tracked in AUTOMATED_SECURITY_CHECKS.md.
  # Expiration: protocol hard fork milestone.
  "RUSTSEC-2025-0141",

  # RUSTSEC-2026-0374: basic-toml 0.1.10 is unmaintained.
  # Used transitively for configuration and test data parsing. No untrusted input
  # or network exposure in production node consensus/execution paths.
  # Expiration: 2027-01-01 / scheduled toolchain refresh.
  "RUSTSEC-2026-0374",

  # RUSTSEC-2026-0523: quinn-proto stream limit bypass via crafted MAX_STREAM_DATA.
  # Transitive dependency via libp2p 0.57 / quinn 0.11. Upgrading across major
  # bumps breaks libp2p wire compatibility. P2P connections are authenticated via
  # PeerId and application streams are bounded. Tracked for libp2p transport overhaul.
  # Expiration: 2027-01-01.
  "RUSTSEC-2026-0523",

  # RUSTSEC-2026-0524: quinn-proto DoS via long Retry token / ed25519-consensus malleability.
  # Transitive dependency via libp2p-quic / quinn 0.11 stack. Upgrading across major
  # bumps breaks consensus and networking wire compatibility. Nodes operate behind
  # authenticated transport handshakes. Tracked for next libp2p/quinn bump.
  # Expiration: 2027-01-01.
  "RUSTSEC-2026-0524",

  # RUSTSEC-2026-0538: quinn-udp high CPU spin loop on truncated datagrams.
  # Transitive dependency via libp2p-quic. Upgrading requires breaking libp2p
  # major upgrade. Protected by OS UDP buffer limits and isolated worker threads.
  # Expiration: 2027-01-01.
  "RUSTSEC-2026-0538",
]
