[package]
name = "kovanica-stratum"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Stratum V1 Mining Pool Gateway for Kovanica"

[[bin]]
name = "kovanica-stratum"
path = "src/bin/main.rs"

[dependencies]
kovanica-types = { path = "../kovanica-types" }
kovanica-crypto = { path = "../kovanica-crypto" }
kovanica-sdk = { path = "../kovanica-sdk", default-features = false, features = ["http"] }

tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
clap = { workspace = true, features = ["derive"] }
reqwest = { workspace = true, features = ["json"] }
hex = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
rustls = { version = "0.23", features = ["logging", "std"] }
tokio-rustls = { version = "0.26" }
pem = "3.0"
rcgen = { version = "0.13", optional = true }
chrono = { workspace = true }
# Metrics & observability
prometheus-client = { workspace = true }
axum = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
rcgen = "0.13"
tempfile = "3.8"
tracing-subscriber = { workspace = true, features = ["json"] }

[features]
default = []
self-signed = ["rcgen"]