[package]
name = "kovanica-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Rust JNI bindings for Kovanica mobile node engine (NativeBridge)"

[lib]
name = "kovanica_ffi"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
kovanica-types = { path = "../kovanica-types" }
serde = { workspace = true }
serde_json = { workspace = true }
