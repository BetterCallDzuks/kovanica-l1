name: Release node

# Builds the prebuilt Linux node binaries that node/scripts/install.sh serves,
# plus the chain-2 genesis bundle. Every build is checked against the tag a node
# computes for the same genesis file set, so a binary or bundle that cannot peer
# with its mesh fails here instead of after download.
#
# Chain 2 is the canonical hybrid testnet (PoW + GHOSTDAG, no-stake-82m). The
# bundle is cut with `kovanica-node genesis-bundle --chain-id 2` from
# `testnet/chain2/`, which must hold only the genesis files produced by
# `ops/genesis/ceremony.sh` (genesis_validators.toml, founder_premine.hex,
# optionally funded_accounts.toml / validators.json) and no keys.
#
# `testnet/chain2/` holds the chain-2 genesis files produced by
# `ops/genesis/ceremony.sh`. If `testnet/chain2/genesis_validators.toml` is
# absent, both the tag check and the bundle job fail closed with an explicit
# message. Official release bundle publication awaits the production PRO-21
# founder, treasury and bootstrap validator ceremony addresses.
#
#   git tag v0.1.0-node && git push origin v0.1.0-node
#
# The tag must be <version>-node; install.sh downloads from
# releases/download/v<version>-node.

on:
  push:
    tags: ["v*-node"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The chain-2 genesis file set. Cut it with ops/genesis/ceremony.sh and commit
  # only its outputs here; genesis-bundle refuses every other entry.
  GENESIS_SOURCE: testnet/chain2
  GENESIS_CHAIN_ID: "2"

jobs:
  validate:
    name: validate tag and version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag matches node Cargo.toml version and is reachable from main
        run: |
          set -eu
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            echo "Validating release tag: $tag"
            tag_ver="${tag#v}"
            tag_ver="${tag_ver%-node}"

            # Extract version for kovanica-node (inherited from [workspace.package] or crates/kovanica-node/Cargo.toml)
            node_ver="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' crates/kovanica-node/Cargo.toml | head -n 1)"
            if [ -z "$node_ver" ]; then
              node_ver="$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml | sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' | head -n 1)"
            fi

            if [ -z "$node_ver" ]; then
              echo "::error::Could not determine node version from Cargo.toml"
              exit 1
            fi

            if [ "$tag_ver" != "$node_ver" ]; then
              echo "::error::Tag version '$tag_ver' does not match node Cargo.toml version '$node_ver'"
              exit 1
            fi
            echo "Tag version '$tag_ver' matches node Cargo.toml version '$node_ver'"

            # Verify tag commit is reachable from main
            git fetch origin main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::Tag commit $(git rev-parse HEAD) is not reachable from origin/main"
              exit 1
            fi
            echo "Tag commit is reachable from origin/main"
          else
            echo "Not a tag trigger ($GITHUB_REF); skipping tag reachability validation"
          fi

  build:
    name: node ${{ matrix.arch }}
    needs: [validate]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Check the chain-2 genesis source exists
        run: |
          set -eu
          if [ ! -f "$GENESIS_SOURCE/genesis_validators.toml" ]; then
            echo "::error::$GENESIS_SOURCE/genesis_validators.toml is missing. No official chain-2 genesis has been cut yet; run ops/genesis/ceremony.sh with the owner's PRO-21 founder, treasury and validator addresses and commit its output there. Refusing to package the retired chain-4 bundle."
            exit 1
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Install Rust (version from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Build kovanica-node
        run: cargo build --release --locked -p kovanica-node

      - name: Check the network tag against the chain-2 genesis set
        run: |
          set -eu
          src="$GENESIS_SOURCE"
          work="$RUNNER_TEMP/tagcheck"
          rm -rf "$work"
          mkdir -p "$work/data"
          # The archive name and the exact bytes are asserted here; bundle
          # output lands outside $src because a genesis directory may hold only
          # genesis files.
          target/release/kovanica-node genesis-bundle \
            --chain-id "$GENESIS_CHAIN_ID" \
            --source "$src" \
            --out "$work/kovanica-testnet-genesis.tar.gz"
          tar -xzf "$work/kovanica-testnet-genesis.tar.gz" -C "$work/data"
          # The bundle tag binds the treasury recorded in
          # genesis_validators.toml. Give this node the same address the way
          # install.sh does, otherwise the comparison below would use the zero
          # treasury and reject a correct bundle.
          treasury="$(sed -n 's/^[[:space:]]*treasury_address[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$work/data/genesis_validators.toml" | head -n 1)"
          cat >"$work/kovanica.toml" <<EOF
          chain_id = 2
          data_dir = "$work/data"
          treasury_address = "$treasury"
          run_validator = false
          rpc_addr = "127.0.0.1"
          rpc_port = 8545
          bootnodes = []
          round_duration_ms = 4000
          EOF
          tag="$(target/release/kovanica-node network-tag --config "$work/kovanica.toml")"
          expected="$(cat "$work/data/expected-tag")"
          canonical="2-24cdb5fadd98b207"
          echo "network tag: $tag (bundle expected-tag: $expected, kovanica-testnet: $canonical)"
          if [ "$tag" != "$expected" ]; then
            echo "::error::network tag $tag does not match the bundle's expected-tag $expected; a node installing this bundle would be isolated from the mesh"
            exit 1
          fi
          if [ "$tag" != "$canonical" ]; then
            echo "::error::network tag $tag is not the kovanica-testnet tag $canonical"
            exit 1
          fi
          ( cd "$work/data" && sha256sum -c SHA256SUMS )

      - name: Package
        run: |
          set -eu
          mkdir -p dist
          install -m 0755 target/release/kovanica-node dist/kovanica-node
          strip dist/kovanica-node
          cp LICENSE dist/
          tar -C dist -czf "kovanica-node-${{ matrix.arch }}-linux.tar.gz" .
          ls -l "kovanica-node-${{ matrix.arch }}-linux.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.arch }}
          path: kovanica-node-${{ matrix.arch }}-linux.tar.gz
          if-no-files-found: error

  bundle:
    name: chain-2 genesis bundle
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: node-x86_64
          path: node-dist

      - name: Cut the chain-2 genesis bundle
        run: |
          set -eu
          src="$GENESIS_SOURCE"
          if [ ! -f "$src/genesis_validators.toml" ]; then
            echo "::error::$src/genesis_validators.toml is missing. No official chain-2 genesis has been cut yet; run ops/genesis/ceremony.sh with the owner's PRO-21 founder, treasury and validator addresses and commit its output there."
            exit 1
          fi
          tar -xzf node-dist/kovanica-node-x86_64-linux.tar.gz -C node-dist
          mkdir -p dist
          node-dist/kovanica-node genesis-bundle \
            --chain-id "$GENESIS_CHAIN_ID" \
            --source "$src" \
            --out dist/kovanica-testnet-genesis.tar.gz
          # The installer verifies SHA256SUMS from the extracted bundle; do the
          # same check here so a broken archive never reaches a release.
          verify="$RUNNER_TEMP/bundle-verify"
          rm -rf "$verify"
          mkdir -p "$verify"
          tar -xzf dist/kovanica-testnet-genesis.tar.gz -C "$verify"
          ( cd "$verify" && sha256sum -c SHA256SUMS )
          ls -l dist/kovanica-testnet-genesis.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: genesis-bundle
          path: dist/kovanica-testnet-genesis.tar.gz
          if-no-files-found: error

  checksums:
    name: SHA256SUMS
    needs: [build, bundle]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        run: |
          set -eu
          cd dist
          sha256sum ./*.tar.gz | sed 's| \./| |' >SHA256SUMS
          test -s SHA256SUMS
          grep -q 'kovanica-node-x86_64-linux.tar.gz' SHA256SUMS
          grep -q 'kovanica-node-aarch64-linux.tar.gz' SHA256SUMS
          grep -q 'kovanica-testnet-genesis.tar.gz' SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: publish release
    needs: [build, bundle, checksums]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify SHA256SUMS from checksums job
        run: |
          set -eu
          cd dist
          test -s SHA256SUMS
          grep -q 'kovanica-node-x86_64-linux.tar.gz' SHA256SUMS
          grep -q 'kovanica-node-aarch64-linux.tar.gz' SHA256SUMS
          grep -q 'kovanica-testnet-genesis.tar.gz' SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "kovanica-node ${GITHUB_REF_NAME%-node} (kovanica-testnet)" \
            --notes "$(cat <<'EOF'
          Prebuilt `kovanica-node` for kovanica-testnet.

          Network tag: `2-24cdb5fadd98b207`. External peers bootstrap at `seed1.kovanica.online:8000` (DNS name only).

          | Asset | Target |
          |---|---|
          | `kovanica-node-x86_64-linux.tar.gz` | Linux x86_64 (glibc) |
          | `kovanica-node-aarch64-linux.tar.gz` | Linux aarch64/arm64 (glibc) |
          | `kovanica-testnet-genesis.tar.gz` | genesis bundle every chain-2 node must share |
          | `SHA256SUMS` | checksums for all assets above |

          Install (non-validating full node, RPC on loopback):

          ```sh
          curl -fsSL https://kovanica.online/download/install.sh | sh
          ```

          Or download `install.sh` next to the assets and run it with
          `KOVANICA_RELEASE_BASE` pointing at this directory:

          ```sh
          KOVANICA_RELEASE_BASE="$(pwd)" sh install.sh --no-service
          ```

          The installer verifies the checksums, installs the chain-2 genesis
          bundle and refuses to start unless the node's network tag equals the
          `expected-tag` file inside that bundle.

          Each asset is built from the tagged commit; the build fails unless the
          genesis bundle cut from `testnet/chain2/` reproduces its own
          `expected-tag` and `SHA256SUMS`.
          Docs: https://docs.kovanica.online
          EOF
          )"
